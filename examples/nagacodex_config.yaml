faq:
  - question: Was ist KI-SEO (GEO/AEO)?
    answer: >
      KI-SEO — auch Generative Engine Optimization (GEO) oder Answer Engine
      Optimization (AEO) genannt — umfasst Maßnahmen, die dafür sorgen, dass
      Ihre Marke und Inhalte in den Antworten von KI-Systemen wie ChatGPT,
      Perplexity, Google AI Overviews und Bing Copilot zitiert werden.
      Im Unterschied zu klassischem SEO geht es nicht nur um Rankings,
      sondern darum, als vertrauenswürdige Quelle in generierten Antworten
      zu erscheinen.
  - question: Was kostet ein SEO-Audit bei Naga Codex?
    answer: >
      Ein initiales SEO- und KI-Sichtbarkeits-Audit gibt es als schlankes
      Diagnostic-Paket. Kontaktieren Sie uns über die Website für ein
      unverbindliches Gespräch.
  - question: Welche Suchmaschinen deckt ihr ab?
    answer: >
      Wir optimieren für alle relevanten Plattformen: Google Search und
      Google AI Overviews, Bing und Bing Copilot (Yahoo ist Bing-powered),
      sowie KI-Antwortmaschinen wie ChatGPT (mit Web-Suche),
      Perplexity und Claude.

